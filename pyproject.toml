[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "swarmlord"
version = "0.1.1"
description = "Orchestrator for project packets — coordinates a swarm of agent-workers."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "James Sesler" }]
keywords = ["orchestration", "agents", "packets", "claude-code", "sandcastle"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development",
]
dependencies = [
    "pydantic>=2.7",
    "typer>=0.12",
    "jinja2>=3.1",
    "ruamel.yaml>=0.18",
    "python-frontmatter>=1.1",
    "rich>=13.7",
    "httpx>=0.27",
    "pyperclip>=1.9",
]

[project.optional-dependencies]
server = [
    "fastapi>=0.110",
    "uvicorn>=0.30",
]

[project.urls]
Homepage = "https://github.com/HuginnIndustries/swarmlord"
Repository = "https://github.com/HuginnIndustries/swarmlord"
Issues = "https://github.com/HuginnIndustries/swarmlord/issues"
Changelog = "https://github.com/HuginnIndustries/swarmlord/blob/main/CHANGELOG.md"

[project.scripts]
swarmlord = "swarmlord.cli:app"
swarm = "swarmlord.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.14",
    "mypy>=1.10",
    "ruff>=0.5",
    "fastapi>=0.110",
    "httpx>=0.27",
]

[tool.hatch.build.targets.wheel]
packages = ["src/swarmlord"]

[tool.hatch.build.targets.sdist]
include = [
    "src/swarmlord",
    "templates/packet",
    "tests",
    "README.md",
    "GUIDE.md",
    "CHANGELOG.md",
    "LICENSE",
    "pyproject.toml",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "N",    # pep8-naming
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
]
ignore = [
    "E501",  # line length handled by formatter
    "B008",  # function call in default arg (Typer uses this)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "N802"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
pretty = true
show_error_codes = true
files = ["src/swarmlord"]

[[tool.mypy.overrides]]
module = ["pyperclip.*", "frontmatter.*", "ruamel.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:pydantic.*",
]

[tool.coverage.run]
source = ["src/swarmlord"]
branch = true
omit = [
    "src/swarmlord/server/*",
    "src/swarmlord/runners/claude_code.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "\\.\\.\\.",
]
fail_under = 80
show_missing = true
