name: Feature request
description: Suggest an enhancement or new capability.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Before filing: skim [`AGENTS.md`](../../AGENTS.md) and [`spec/build-spec.md`](../../spec/build-spec.md). Several architectural choices are locked in and won't be relitigated.

  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the situation, not the solution. "When I do X, Y happens, and I want Z."
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: What would you like SwarmLord to do? CLI surface, config knob, behavior change, etc.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What workarounds have you tried? Why aren't they enough?

  - type: textarea
    id: scope
    attributes:
      label: Scope check
      description: Is this V1, V2, or V3? See the roadmap in `README.md`. V2/V3 features (server bodies, multi-tenancy, hosted SaaS) are tracked separately.
