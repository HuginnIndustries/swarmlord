name: Bug report
description: Something is broken or behaving unexpectedly.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please fill in the fields below — they make triage much faster.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear, concrete description of the bug.
      placeholder: "swarmlord promote my-packet --to discovery exits with X but I expected Y."
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Exact commands and (if relevant) the contents of `workflow/status.yaml` and `workflow/WORKFLOW.md`.
      render: shell
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: SwarmLord version
      description: Output of `swarmlord --version`.
      placeholder: "0.1.1"
    validations:
      required: true

  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "3.12.7"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux
        - macOS
        - Windows
        - Other
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Logs, screenshots, related issues, hypotheses about cause.
